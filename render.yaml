services:
  - type: web
    name: last-z-intel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SOURCE_TEMPLATE
        value: https://last-z.us/rankings?playerServers={server}
